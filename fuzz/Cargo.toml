[package]
name = "eventbus-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eventbus-kit = { path = ".." }
serde_json = "1"

# False positive: the dependency is used as `typed_eventbus::...` because the
# crate's lib target is renamed (see `[lib] name` in the root Cargo.toml).
[package.metadata.cargo-machete]
ignored = ["eventbus-kit"]

[[bin]]
name = "fuzz_envelope"
path = "fuzz_targets/fuzz_envelope.rs"
test = false
doc = false
