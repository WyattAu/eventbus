[package]
name = "eventbus-kit"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["WyattAu"]
description = "Async event bus for Rust — typed pub/sub with optional persistence, replay, and wildcard subscriptions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/eventbus"
keywords = ["event", "pubsub", "async", "messaging", "bus"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["/target"]
readme = "README.md"

[lib]
name = "typed_eventbus"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "derive"], optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[[bench]]
name = "eventbus_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[features]
default = []
postgres = ["dep:sqlx"]
sqlite = ["dep:rusqlite"]
